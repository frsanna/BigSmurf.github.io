<section id="hero" class="section hero">
  <div class="overlay"></div>
  <div class="hero-content">
    <button type="button" class="avatar" id="trigger-logo" aria-label="Play logo animation easter egg"></button>
    <div id="easter-egg" class="noselect" aria-hidden="true">
      <div class="egg-backdrop" data-egg-close tabindex="-1" aria-label="Close"></div>
      <div class="logo egg-stage">
        <div class="frame" aria-hidden="true">
          <div class="line h-line top"></div>
          <div class="line v-line right"></div>
          <div class="line h-line bottom"></div>
          <div class="line v-line left"></div>
        </div>
        <div class="square top-left" aria-hidden="true"></div>
        <div class="square bottom-right" aria-hidden="true"></div>
        <div class="egg-core">
          <div class="letters" aria-hidden="true">
            <span class="letter-f">F</span>
            <span class="letter-s">S</span>
          </div>
          <p class="egg-tagline">You found the quiet layer.</p>
          <p class="egg-hint">Based in Cagliari. Remote work, relocation, or regular travel are all fine.</p>
          <a href="#contact" class="egg-cta">Get in touch</a>
        </div>
      </div>
    </div>
    <h1>Francesco Sanna</h1>
    <p class="subtitle">Engineering Manager &amp; Technical Lead</p>
    <div class="hero-buttons">
      <a href="resources/curriculum.pdf" class="btn primary"><i class="fas fa-download"></i> Download CV</a>
      <a href="#contact" class="btn outline">Get in Touch</a>
    </div>
  </div>
</section>
